name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # release-please opens its release PR with GITHUB_TOKEN, which creates a
    # pull_request run that can only sit in action_required. Its output set is
    # exactly these files, so excluding them means no run is ever created.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - package.json

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The beads CLI lets the BeadsStore conformance suite run for real (it
      # self-skips when bd is absent). One OS of real coverage suffices: the
      # backend drives bd purely through --json subprocesses, so the suite is
      # OS-independent. Pinned so a bd release cannot break CI on its own.
      - if: runner.os == 'Linux'
        run: npm install -g @beads/bd@1.2.2
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build:skill -- --check
